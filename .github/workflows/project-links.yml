name: Check Project Quilt links

on:
  workflow_dispatch:
  push:
    paths:
      - "data/project-quilt.json"\n      - "data/project-live-candidates.json"
      - "scripts/check-project-links.mjs"
      - ".github/workflows/project-links.yml"
  schedule:
    - cron: "17 20 * * 0"

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check playable project URLs
        run: node scripts/check-project-links.mjs
      - name: Upload link report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-link-check
          path: artifacts/
