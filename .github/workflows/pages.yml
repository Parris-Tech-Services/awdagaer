name: Rebuild SIGNAL BENEATH site

on:
  push:
    branches:
      - master
      - ccr-44f57a1d-38xyzm
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: signal-beneath-pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Chapter One source
        uses: actions/checkout@v4
        with:
          ref: ccr-44f57a1d-38xyzm
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Chapter One tests
        run: npm test

      - name: Assemble launcher, Chapter One and Quilt
        run: bash scripts/build-site.sh site-dist

      - name: Record source versions
        run: |
          printf '%s\n' '{"chapter_one":"'$(git rev-parse HEAD)'","quilt":"'$(git rev-parse origin/master)'"}' > site-dist/build-info.json

      - name: Check out published site
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: _publish
          fetch-depth: 0

      - name: Sync built site to gh-pages checkout
        run: |
          rsync -a --delete --exclude='.git' site-dist/ _publish/
          touch _publish/.nojekyll

      - name: Publish if anything changed
        working-directory: _publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No site changes to publish."
            exit 0
          fi
          git commit -m "deploy: rebuild Signal Beneath site"
          git push origin HEAD:gh-pages
